services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thermalwatch}
      POSTGRES_USER: ${POSTGRES_USER:-thermalwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thermalwatch}
    ports:
      - "5432:5432"
    volumes:
      - thermalwatch_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thermalwatch} -d ${POSTGRES_DB:-thermalwatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://thermalwatch:thermalwatch@db:5432/thermalwatch}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-["http://localhost:3000"]}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data/cache:/app/data/cache
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  thermalwatch_postgres:
